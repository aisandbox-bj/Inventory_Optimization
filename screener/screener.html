<main class="shell screener-shell">
  <div id="root">

    <section id="banner" class="loaded-banner">
      <div>
        <span class="lab">Loading</span>
        <h2>—</h2>
        <div class="sub">awaiting canonical JSON from local storage…</div>
      </div>
      <div class="row"></div>
      <div class="row"></div>
    </section>

    <!-- APP-CANVAS (2026-09-26) — the picker: filters (left) · checklist table (right) → ▶ Launch Canvas -->
    <div class="scr-toolbar" id="scrToolbar" hidden>
      <div class="scr-selcount" id="scrSelCount">0 selected</div>
      <div class="scr-toolbar-spacer"></div>
      <button id="btnComments" class="ghost" title="Back up or restore your saved comments. Comments are kept against each material in this browser and survive deleting the JSON — export a small file to keep them across browsers or machines.">💬 Comments</button>
      <button id="btnExport" class="ghost" title="One quick letter-size PDF page per selected material (chart, stats, MRP and phase distribution).">⤓ Quick PDF (0)</button>
      <button id="btnBuildReport" class="ghost" title="A customisable US Letter report for every selected material — choose and reorder the blocks." disabled>⤓ Letter report (0)</button>
      <button id="btnLaunch" class="primary scr-launch" title="Open the selected materials in the Canvas — one widescreen page per material, all using your master layout." disabled>▶ Launch Canvas (0)</button>
      <input type="file" id="commentsImport" accept="application/json,.json" hidden />
    </div>

    <div class="scr-main" id="scrMain" hidden>
      <aside class="scr-filter">
        <div class="scr-filter-h">
          <span>Screening filters</span>
          <button id="btnClearBands" class="ghost scr-mini" title="Clear every filter — show all analysed materials">Clear all</button>
        </div>
        <div class="scr-filter-note">Filters only change what the table shows — your ticks are kept.</div>
        <div id="bandsBody" class="scr-filter-body"></div>
      </aside>

      <section class="scr-tablepane">
        <div class="scr-table-tools">
          <input type="text" id="scrSearch" class="scr-search" placeholder="Search material or description — or paste up to 20 material numbers…" autocomplete="off" />
          <button id="btnSelShown" class="ghost scr-mini" title="Tick every material the table shows now">☑ Select all shown</button>
          <button id="btnUnselShown" class="ghost scr-mini" title="Untick every material the table shows now">☐ Unselect shown</button>
          <button id="btnSelClear" class="ghost scr-mini" title="Untick everything, including ticks hidden by the filters">Clear selection</button>
          <span class="scr-spacer"></span>
          <button id="btnColumns" class="ghost scr-mini" title="Choose, add and arrange the table columns">⚙ Columns…</button>
        </div>
        <div class="scr-table-wrap" id="scrTableWrap"></div>
        <div class="scr-table-meta" id="scrTableMeta"></div>
      </section>
    </div>

  </div>

</main>
